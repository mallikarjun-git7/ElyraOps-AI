name: ElyraOps CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-rag.txt

      - name: Run all tests
        run: python -m unittest discover -s tests -v

      - name: Validate Python syntax
        run: python -m compileall -q elyraops agent_service

  secure-rag-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-trixie
        env:
          POSTGRES_DB: elyra_rag
          POSTGRES_USER: elyra_demo
          POSTGRES_PASSWORD: ci-synthetic-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elyra_demo -d elyra_rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      ELYRA_RLS_ADMIN_DATABASE_URL: postgresql://elyra_demo:ci-synthetic-password@127.0.0.1:5432/elyra_rag
      ELYRA_RAG_DATABASE_URL: postgresql://elyra_demo:ci-synthetic-password@127.0.0.1:5432/elyra_rag
      ELYRA_SECURITY_MODE: required
      ELYRA_SECURE_RAG_LIVE_TEST: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-rag.txt
      - name: Initialize fresh database and RLS
        run: |
          python -m agent_service.rag_pg init
          python scripts/setup_rls.py
          python scripts/setup_secure_rag.py --apply
      - name: Run live cross-tenant RAG security tests (no AI API key)
        run: |
          set -a
          source .env.rls
          set +a
          python -m unittest discover -s tests -p test_secure_rag_phase4.py -v

  phase6-docker-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate Phase 6 Compose configuration with synthetic placeholders
        env:
          ELYRA_CASES_DATABASE_URL: postgresql://elyra_cases_runtime:ci-placeholder@rag-db:5432/elyra_rag
          ELYRA_AGENT_TOKEN: ci-synthetic-only-do-not-deploy-1111111111
          ELYRA_ACCESS_TOKENS_JSON: '{}'
        run: docker compose -f compose.phase6.yml config --quiet
      - name: Build Python 3.13 deployment image
        run: docker build -f Dockerfile.phase6 -t elyraops-phase6:ci .
      - name: Smoke test both services over localhost (no real credentials)
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f elyra-phase6-ci-dashboard elyra-phase6-ci-agent >/dev/null 2>&1 || true' EXIT
          docker run -d --rm --name elyra-phase6-ci-agent \
            -p 127.0.0.1:18091:8091 elyraops-phase6:ci \
            python -m uvicorn agent_service.app:app --host 0.0.0.0 --port 8091
          docker run -d --rm --name elyra-phase6-ci-dashboard \
            -e HOST=0.0.0.0 -e PORT=8082 \
            -p 127.0.0.1:18082:8082 elyraops-phase6:ci \
            python -m elyraops.server
          python scripts/phase6_smoke.py \
            --dashboard-url http://127.0.0.1:18082 \
            --agent-url http://127.0.0.1:18091
          # A successful smoke test establishes container liveness only.
          # Existing secure-rag-postgres tests separately verify tenant RLS.
