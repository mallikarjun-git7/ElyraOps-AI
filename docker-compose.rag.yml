name: elyraops-rag
services:
  rag-db:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    ports:
      - "127.0.0.1:5447:5432"
    environment:
      POSTGRES_DB: elyra_rag
      POSTGRES_USER: elyra_demo
      POSTGRES_PASSWORD: elyra_demo_pw_change_for_real_use
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elyra_demo -d elyra_rag"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - rag_data:/var/lib/postgresql/data
volumes:
  rag_data:
